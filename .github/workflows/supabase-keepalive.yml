name: Keep the café's Supabase project awake

# Free Supabase projects pause after about a week without database activity, which would
# take the café's multiplayer offline. Twice a week, read the one-row `keepalive` table.
# The publishable key is public by design (it ships in the site), so it's fine inline.

on:
  schedule:
    - cron: "17 15 * * 1,4" # Mondays and Thursdays
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the keepalive row
        run: |
          curl --fail --silent --show-error \
            "https://lepsbyqwrplrcmvsofjy.supabase.co/rest/v1/keepalive?select=id" \
            -H "apikey: sb_publishable_dBEMNmWqLLZCcU-eZ6AZvQ_Zh2tz6-H"
