name: Update Productivity Tracker

on:
  pull_request:
    types: [review_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker repo
        uses: actions/checkout@v4
        with:
          repository: daniel04wawng/abundant-productivity-tracker
          path: tracker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tracker
          python -m pip install --upgrade pip
          pip install -r requirements.txt

